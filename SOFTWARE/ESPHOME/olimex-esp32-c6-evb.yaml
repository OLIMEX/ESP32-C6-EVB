esphome:
  name: esp32-c6-evb
  comment: Olimex ESP32-C6-EVB with relays, opto inputs, LED and button

esp32:
  board: esp32-c6-devkitc-1
  framework:
    type: arduino

logger:

# ================= NETWORKING =================

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "ESP32-C6-EVB Fallback"
    password: "fallback123"

captive_portal:

# ================= ONBOARD IO =================

# ---- User Button (active LOW) ----
binary_sensor:
  - platform: gpio
    name: "User Button"
    pin:
      number: GPIO9
      mode: INPUT_PULLUP
      inverted: true

# ---- Optocoupler Inputs (active LOW) ----
  - platform: gpio
    name: "IN1 Opto"
    pin:
      number: GPIO1
      mode: INPUT
      inverted: true

  - platform: gpio
    name: "IN2 Opto"
    pin:
      number: GPIO2
      mode: INPUT
      inverted: true

  - platform: gpio
    name: "IN3 Opto"
    pin:
      number: GPIO3
      mode: INPUT
      inverted: true

  - platform: gpio
    name: "IN4 Opto"
    pin:
      number: GPIO15
      mode: INPUT
      inverted: true


# ---- Relays (ACTIVE HIGH) ----
switch:
  - platform: gpio
    name: "Relay 1"
    pin: GPIO10
    id: relay1
    restore_mode: OFF

  - platform: gpio
    name: "Relay 2"
    pin: GPIO11
    id: relay2
    restore_mode: OFF

  - platform: gpio
    name: "Relay 3"
    pin: GPIO22
    id: relay3
    restore_mode: OFF

  - platform: gpio
    name: "Relay 4"
    pin: GPIO23
    id: relay4
    restore_mode: OFF


# ---- User LED (ACTIVE LOW) ----
output:
  - platform: gpio
    pin: GPIO8
    id: user_led_output
    inverted: true

light:
  - platform: binary
    name: "User LED"
    output: user_led_output

# ================= CORE SERVICES =================

ota:
  - platform: esphome

api: