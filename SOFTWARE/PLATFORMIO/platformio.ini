[env:esp32-c6-evb]
platform = espressif32
board = esp32-c6-evb
framework = arduino

monitor_speed = 115200
upload_speed = 921600

; ===== Native USB (CRITICAL for C6) =====
build_flags =
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1

; Optional but useful
monitor_filters = esp32_exception_decoder